<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>斑龜日記</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 清除網頁紀錄：存檔與設定、瀏覽器暫存的舊版程式，全部清掉後重新載入。
    // 設定裡的「重新開始」會呼叫它；手機畫面壞掉、按不到按鈕時，直接開「網址?reset=1」。
    (function () {
      // 遊戲的程式與樣式（新增 js 檔時要加進來）
      var FILES = [
        './',
        'index.html',
        'css/style.css',
        'assets/manifest.json',
        'assets/poses/index.json',
        'js/assets.js',
        'js/config.js',
        'js/decor.js',
        'js/main.js',
        'js/menu.js',
        'js/poses.js',
        'js/requests.js',
        'js/sim.js',
        'js/species.js',
        'js/state.js',
        'js/tank.js',
        'js/tank3d.js',
        'js/terrain.js',
        'js/turtle-agent.js',
        'js/turtle-shape.js',
        'js/ui.js'
      ];
      window.hardReset = async function () {
        window.__banGuiResetting = true; // 之後的自動存檔都不要寫（不然關頁時會把舊存檔寫回去）
        try {
          for (var i = localStorage.length - 1; i >= 0; i--) {
            var k = localStorage.key(i);
            if (k && k.indexOf('banGui.') === 0) localStorage.removeItem(k);
          }
        } catch (e) {}
        try { sessionStorage.clear(); } catch (e) {}
        try {
          if (window.caches) {
            var names = await caches.keys();
            await Promise.all(names.map(function (n) { return caches.delete(n); }));
          }
        } catch (e) {}
        try {
          if (navigator.serviceWorker) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
        } catch (e) {}
        // 用 cache: 'reload' 重新下載一次，瀏覽器暫存裡的舊版程式就會被換掉
        var urls = FILES.slice();
        try {
          performance.getEntriesByType('resource').forEach(function (e) {
            if (e.name.indexOf(location.origin) === 0) urls.push(e.name);
          });
        } catch (e) {}
        await Promise.all(urls.map(function (u) {
          return fetch(u, { cache: 'reload' }).catch(function () { return null; });
        }));
        location.replace(location.pathname + '?fresh=' + Date.now());
      };
      if (/[?&]reset=1(&|$)/.test(location.search)) {
        document.documentElement.classList.add('resetting');
        window.hardReset();
      }
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="frame" id="frame">
    <header class="topbar">
      <div class="logo" id="logo" aria-hidden="true">🐢</div>
      <div class="top-right">
        <button id="btnView" class="icon-btn" type="button"></button>
        <button id="btnFullscreen" class="icon-btn" type="button" aria-label="全螢幕" aria-pressed="false">⛶</button>
        <div class="clock" id="clock"></div>
      </div>
    </header>

    <main class="stage">
      <section class="tank-wrap">
        <canvas id="tank" aria-label="烏龜缸"></canvas>
        <div class="toast" id="toast" role="status"></div>
        <!-- 想互動請求：右下角直排的圓形按鈕（js/requests.js） -->
        <div class="requests" id="requests" aria-label="烏龜想做的事"></div>
      </section>
    </main>

    <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>

    <div class="submenu" id="submenu" hidden></div>

    <!-- 底部功能表的 5 個分頁與各自子項由 js/menu.js 的 NAV 決定 -->
    <nav class="bottom-nav" id="bottomNav" aria-label="功能表"></nav>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2 id="sheetTitle"></h2>
        <button type="button" class="sheet-close" id="sheetClose" aria-label="關閉">✕</button>
      </div>
      <div class="sheet-body" id="sheetBody">
        <div class="sheet-section" data-section="turtles" hidden>
          <div class="sec-title">缸裡的烏龜 <span id="turtleCount"></span></div>
          <ul class="turtle-list" id="turtleList"></ul>
          <button id="btnAdd" class="add-btn">＋ 新增烏龜</button>
          <div id="stats"></div>
        </div>

        <div class="sheet-section" data-section="feed" hidden>
          <div class="sec-title">餵食</div>
          <div class="food-grid" id="foodGrid"></div>
          <div class="hint">選一種食物，再點水缸就會在那裡丟一顆；再按一次或按 Esc 取消</div>
        </div>

        <div class="sheet-section" data-section="care" hidden>
          <div class="sec-title">照顧</div>
          <div class="group-title">環境</div>
          <div class="btn-row">
            <button data-act="water">💧 換水</button>
            <button data-act="lamp" id="btnLamp">💡 曬背燈</button>
          </div>
          <label class="toggle"><input type="checkbox" id="chkTimer"> 曬背燈定時器（08:00–18:00）</label>
          <div class="group-title">互動（選取中的烏龜）</div>
          <div class="btn-row">
            <button data-act="play">🤲 陪牠玩</button>
            <button data-act="vet" id="btnVet">🏥 看獸醫</button>
          </div>
        </div>

        <div class="sheet-section equipment" data-section="equip" hidden>
          <div class="sec-title">設備</div>
          <label class="equip-row">過濾器
            <select id="eqFilter">
              <option value="none">沒有過濾器</option>
              <option value="small">小型過濾器</option>
              <option value="strong">強力過濾器</option>
            </select>
          </label>
          <label class="equip-row">燈具
            <select id="eqLamp">
              <option value="heat">保溫燈（沒有 UVB）</option>
              <option value="uvb">UVB 曬背燈</option>
            </select>
          </label>
          <label class="toggle"><input type="checkbox" id="eqHeater"> 加溫棒（水溫維持 26℃）</label>
          <div class="hint" id="eqHint"></div>
        </div>

        <div class="sheet-section" data-section="scene" hidden>
          <div class="sec-title">選場景</div>
          <div class="decor-list" id="sceneList"></div>
        </div>

        <div class="sheet-section" data-section="decor" hidden>
          <div class="sec-title">造景擺設</div>
          <div class="decor-list" id="decorList"></div>
        </div>

        <div class="sheet-section" data-section="time" hidden>
          <div class="sec-title">時間</div>
          <div class="speed-row">
            <input type="range" id="speed" min="1" max="10" step="1" value="1" aria-label="時間速度">
            <output id="speedOut" for="speed">1x</output>
          </div>
          <div class="hint">速度只在網頁開著時有效，離開網頁的時間一律照 1 倍計算</div>
          <div class="group-title">快轉（會照常變餓、水變髒）</div>
          <div class="btn-row">
            <button data-skip="1">⏩ +1 小時</button>
            <button data-skip="6">⏩ +6 小時</button>
          </div>
          <div class="group-title">調時鐘（直接設定，不模擬中間的時間）</div>
          <form class="btn-row" id="clockForm">
            <input type="time" id="clockInput" required>
            <button type="submit">設定</button>
          </form>
        </div>

        <div class="sheet-section" data-section="log" hidden>
          <div class="sec-title">飼養日誌</div>
          <ul class="log" id="log"></ul>
        </div>

        <div class="sheet-section" data-section="save" hidden>
          <div class="sec-title">存檔</div>
          <div class="save-row">
            <button id="btnExport">匯出存檔</button>
            <button id="btnImport">匯入存檔</button>
            <input type="file" id="fileImport" accept=".json,application/json" hidden>
            <button id="btnReset" class="danger">重新開始</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="speciesModal" hidden>
    <div class="modal-box wide">
      <h2>新增烏龜</h2>
      <p>選一個品種，牠會帶著隨機的名字搬進缸裡（之後可以改名）。</p>
      <div class="species-grid" id="speciesGrid"></div>
      <button type="button" class="ghost" data-close>取消</button>
    </div>
  </div>

  <!-- 互動小遊戲視窗（刷屁屁、擦背甲、摸下巴、拍照共用） -->
  <div class="modal" id="careModal" hidden>
    <div class="modal-box care-box">
      <div class="care-head">
        <h2 id="careTitle"></h2>
        <button type="button" class="sheet-close" data-care-close aria-label="關閉">✕</button>
      </div>
      <p class="care-hint" id="careHint"></p>
      <div class="care-stage">
        <canvas id="careCanvas" aria-label="烏龜"></canvas>
        <div class="care-tool" id="careTool" aria-hidden="true">🪥</div>
      </div>
      <div class="care-progress" aria-hidden="true"><div id="careBar"></div></div>
      <div class="care-actions">
        <button type="button" class="care-shutter" id="careShutter" hidden aria-label="按快門">📸 按快門</button>
        <a class="care-save" id="careSave" hidden>💾 存照片</a>
      </div>
    </div>
  </div>

  <div class="modal" id="renameModal" hidden>
    <form class="modal-box" id="renameForm">
      <h2 id="renameTitle">改名字</h2>
      <input id="renameInput" maxlength="12" required autocomplete="off">
      <div class="modal-actions">
        <button type="button" class="ghost" data-close>取消</button>
        <button type="submit">確定</button>
      </div>
    </form>
  </div>

  <div class="modal" id="detailModal" hidden>
    <div class="modal-box wide">
      <div id="detailBody"></div>
      <button type="button" class="ghost" data-close>關閉</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
